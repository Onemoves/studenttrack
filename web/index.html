<body class="noauth">
<div class="bgfx" aria-hidden="true"><div class="bw b1"><i></i></div><div class="bw b2"><i></i></div><div class="bw b3"><i></i></div></div>
<div class="auth" id="auth"></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="shell">
    <header class="top" id="top"></header>
    <main class="main">
      <div id="view"></div>
      <p class="note" id="mode-note"></p>
    </main>
  </div>
</div>
<nav class="tabs" id="tabs" aria-label="Main menu"></nav>
<div class="sheet-back" id="sheet" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>
